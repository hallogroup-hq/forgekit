name: ForgeKit Continuous Integration

on:
  push:
    branches:
      - main
      - 'preview/**'
  pull_request:
    branches:
      - main
      - 'preview/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run Unit & Integration Test Suite
        run: npm test

      - name: Build Next.js Application
        run: npm run build

      - name: Install Cloudflare Worker Dependencies
        run: npm --prefix workers/design-inspector install

      - name: Typecheck Cloudflare Worker
        run: npm --prefix workers/design-inspector run typecheck

      - name: Verify Cloudflare Worker Wrangler Build
        run: npm --prefix workers/design-inspector run build

